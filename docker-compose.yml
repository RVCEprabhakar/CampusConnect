name: CampusConnect CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: campusconnect_test
          MYSQL_USER: campus_app
          MYSQL_PASSWORD: test_app_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucampus_app -ptest_app_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/campusconnect_test
      SPRING_DATASOURCE_USERNAME: campus_app
      SPRING_DATASOURCE_PASSWORD: test_app_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            prabhakarpatil1234/campusconnect:latest
            prabhakarpatil1234/campusconnect:${{ github.sha }}
